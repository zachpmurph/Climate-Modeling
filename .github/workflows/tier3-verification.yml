name: Tier 3 numerical verification

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Run complete test suite
        run: python -m pytest tests/
      - name: Run standalone 2-D verification matrix
        run: >-
          python src/general/verification/verify_saint_venant_2d.py
          --output tier3-verification-results.json
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier3-verification-results
          path: tier3-verification-results.json
          if-no-files-found: error
